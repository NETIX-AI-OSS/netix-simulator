name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
jobs:
  check:
    runs-on:
      group: e2e-worker
      labels: [build-only, Linux, X64]
    container: rust:1.96.0-bookworm
    timeout-minutes: 30
    steps:
      - name: Install container build tools
        run: |
          for source_list in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source_list" ]; then
              sed -i 's|http://deb.debian.org|https://deb.debian.org|g' "$source_list"
            fi
          done
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::https::Timeout "30";' > /etc/apt/apt.conf.d/80-ci-network
          apt-get update
          apt-get install -y --no-install-recommends cmake perl pkg-config
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked
