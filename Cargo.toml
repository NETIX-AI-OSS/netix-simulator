[package]
name = "simulator"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.93"
description = "Generic, extensible industrial-protocol device simulator (BACnet/Modbus/OPC UA)."
repository = "https://github.com/NETIX-AI-OSS/netix-simulator"
default-run = "simulator"

[[bin]]
name = "simulator"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
# Pin protocol-core’s published MQTT client migration and upstream ratatui upgrade.
# This removes the vulnerable lru and webpki dependency lines. Only the
# simulator-side (`sim`) feature of each adapter is enabled.
sim-core = { git = "https://github.com/NETIX-AI-OSS/netix-protocol-core", rev = "81a822c62b9c1a55309ae859ef2d2f9f44363075" }
proto-bacnet = { git = "https://github.com/NETIX-AI-OSS/netix-protocol-core", rev = "81a822c62b9c1a55309ae859ef2d2f9f44363075", features = ["sim"] }
proto-modbus = { git = "https://github.com/NETIX-AI-OSS/netix-protocol-core", rev = "81a822c62b9c1a55309ae859ef2d2f9f44363075", features = ["sim"] }
proto-opcua = { git = "https://github.com/NETIX-AI-OSS/netix-protocol-core", rev = "81a822c62b9c1a55309ae859ef2d2f9f44363075", features = ["sim"] }

log = "0.4"
env_logger = "0.11"
